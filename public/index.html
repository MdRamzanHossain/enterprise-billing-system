<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Technology - Online Billing & Management System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>

  <!-- html2pdf.js for 1-click high-resolution PDF download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Custom and Print CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
  
  <!-- Root App Shell -->
  <div id="app-root"></div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none print:hidden"></div>

  <!-- Embedded Logo Data -->
  <script src="logo_data.js"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
