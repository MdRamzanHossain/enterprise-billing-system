# Nginx Reverse Proxy Configuration for Master Technology Billing System
# Place this in /etc/nginx/sites-available/sec-gadgets and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your actual domain or server IP

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Allow up to 20MB for high-resolution company logos and invoice data
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket and Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy operations/PDF downloads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable cache for live API routes
        proxy_cache_bypass $http_upgrade;
    }
}
